<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Django">
  <title>Django</title>
  <defs>
    <clipPath id="tile"><rect x="8" y="8" width="240" height="240" rx="62"/></clipPath>
    <clipPath id="mark"><path transform="translate(-58,-58) scale(4.833)" d="M11.146 0h3.924v18.166c-2.013.382-3.491.535-5.096.535-4.791 0-7.288-2.166-7.288-6.32 0-4.002 2.65-6.6 6.753-6.6.637 0 1.121.05 1.707.203zm0 9.143a3.894 3.894 0 00-1.325-.204c-1.988 0-3.134 1.223-3.134 3.365 0 2.09 1.096 3.236 3.109 3.236.433 0 .79-.025 1.35-.102V9.142zM21.314 6.06v9.098c0 3.134-.229 4.638-.917 5.937-.637 1.249-1.478 2.039-3.211 2.905l-3.644-1.733c1.733-.815 2.574-1.53 3.109-2.625.561-1.121.739-2.421.739-5.835V6.059h3.924zM17.39.021h3.924v4.026H17.39z"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C4B33"/><stop offset="100%" stop-color="#06291C"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="55%" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#44B78B" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#44B78B" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <style>
    .halo    { animation: pulse   3.6s ease-in-out 0.0s infinite; }
    .breathe { animation: breathe 3.6s ease-in-out 0.0s infinite; }
    .sheen   { animation: sweep   3.6s ease-in-out 0.0s infinite; }
    .ring    { stroke-dasharray: 210 810; animation: trace 3.6s linear 0.0s infinite; }

    @keyframes breathe { 0%,100% { transform: scale(.95); } 50% { transform: scale(1.05); } }
    @keyframes pulse   { 0%,100% { transform: scale(.85); opacity:.28; } 50% { transform: scale(1.15); opacity:.75; } }
    @keyframes sweep   { 0% { transform: translateX(-190px); } 55%,100% { transform: translateX(190px); } }
    @keyframes trace   { to { stroke-dashoffset: -1020; } }

    @media (prefers-reduced-motion: reduce) {
      .halo,.breathe,.sheen,.ring { animation: none; }
    }
  </style>

  <g clip-path="url(#tile)">
    <rect x="8" y="8" width="240" height="240" rx="62" fill="url(#bg)"/>
    <g transform="translate(128,128)">
      <circle class="halo" cx="0" cy="0" r="78" fill="url(#halo)" filter="url(#soft)"/>
    </g>
  </g>

  <g transform="translate(128,128)">
    <g class="breathe">
      <path transform="translate(-58,-58) scale(4.833)" d="M11.146 0h3.924v18.166c-2.013.382-3.491.535-5.096.535-4.791 0-7.288-2.166-7.288-6.32 0-4.002 2.65-6.6 6.753-6.6.637 0 1.121.05 1.707.203zm0 9.143a3.894 3.894 0 00-1.325-.204c-1.988 0-3.134 1.223-3.134 3.365 0 2.09 1.096 3.236 3.109 3.236.433 0 .79-.025 1.35-.102V9.142zM21.314 6.06v9.098c0 3.134-.229 4.638-.917 5.937-.637 1.249-1.478 2.039-3.211 2.905l-3.644-1.733c1.733-.815 2.574-1.53 3.109-2.625.561-1.121.739-2.421.739-5.835V6.059h3.924zM17.39.021h3.924v4.026H17.39z" fill="#FFFFFF"/>
      <g clip-path="url(#mark)">
        <rect class="sheen" x="-45" y="-128" width="90" height="256" fill="url(#sheen)"/>
      </g>
    </g>
  </g>

  <rect class="ring" x="8" y="8" width="240" height="240" rx="62"
        fill="none" stroke="#44B78B" stroke-width="4" stroke-linecap="round" opacity=".9"/>
</svg>
