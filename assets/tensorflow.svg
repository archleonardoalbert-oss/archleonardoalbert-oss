<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="TensorFlow">
  <title>TensorFlow</title>
  <defs>
    <clipPath id="tile"><rect x="8" y="8" width="240" height="240" rx="62"/></clipPath>
    <clipPath id="mark"><path transform="translate(-58,-58) scale(4.833)" d="M1.292 5.856L11.54 0v24l-4.095-2.378V7.603l-6.168 3.564.015-5.31zm21.43 5.311l-.014-5.31L12.46 0v24l4.095-2.378V14.87l3.092 1.788-.018-4.618-3.074-1.756V7.603l6.168 3.564z"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17171F"/><stop offset="100%" stop-color="#0C0C11"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="55%" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8F00" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#FF8F00" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <style>
    .halo    { animation: pulse   3.6s ease-in-out 1.4s infinite; }
    .breathe { animation: breathe 3.6s ease-in-out 1.4s infinite; }
    .sheen   { animation: sweep   3.6s ease-in-out 1.4s infinite; }
    .ring    { stroke-dasharray: 210 810; animation: trace 3.6s linear 1.4s infinite; }

    @keyframes breathe { 0%,100% { transform: scale(.95); } 50% { transform: scale(1.05); } }
    @keyframes pulse   { 0%,100% { transform: scale(.85); opacity:.28; } 50% { transform: scale(1.15); opacity:.75; } }
    @keyframes sweep   { 0% { transform: translateX(-190px); } 55%,100% { transform: translateX(190px); } }
    @keyframes trace   { to { stroke-dashoffset: -1020; } }

    @media (prefers-reduced-motion: reduce) {
      .halo,.breathe,.sheen,.ring { animation: none; }
    }
  </style>

  <g clip-path="url(#tile)">
    <rect x="8" y="8" width="240" height="240" rx="62" fill="url(#bg)"/>
    <g transform="translate(128,128)">
      <circle class="halo" cx="0" cy="0" r="78" fill="url(#halo)" filter="url(#soft)"/>
    </g>
  </g>

  <g transform="translate(128,128)">
    <g class="breathe">
      <path transform="translate(-58,-58) scale(4.833)" d="M1.292 5.856L11.54 0v24l-4.095-2.378V7.603l-6.168 3.564.015-5.31zm21.43 5.311l-.014-5.31L12.46 0v24l4.095-2.378V14.87l3.092 1.788-.018-4.618-3.074-1.756V7.603l6.168 3.564z" fill="#FF6F00"/>
      <g clip-path="url(#mark)">
        <rect class="sheen" x="-45" y="-128" width="90" height="256" fill="url(#sheen)"/>
      </g>
    </g>
  </g>

  <rect class="ring" x="8" y="8" width="240" height="240" rx="62"
        fill="none" stroke="#FF8F00" stroke-width="4" stroke-linecap="round" opacity=".9"/>
</svg>
