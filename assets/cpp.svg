<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="C++">
  <title>C++</title>
  <defs>
    <clipPath id="tile"><rect x="8" y="8" width="240" height="240" rx="62"/></clipPath>
    <clipPath id="mark"><path transform="translate(-58,-58) scale(4.833)" d="M22.394 6c-.167-.29-.398-.543-.652-.69L12.926.22c-.509-.294-1.34-.294-1.848 0L2.26 5.31c-.508.293-.923 1.013-.923 1.6v10.18c0 .294.104.62.271.91.167.29.398.543.652.69l8.816 5.09c.508.293 1.34.293 1.848 0l8.816-5.09c.254-.147.485-.4.652-.69.167-.29.27-.616.27-.91V6.91c.003-.294-.1-.62-.268-.91zM12 19.11c-3.92 0-7.109-3.19-7.109-7.11 0-3.92 3.19-7.11 7.11-7.11a7.133 7.133 0 016.156 3.553l-3.076 1.78a3.567 3.567 0 00-3.08-1.78A3.56 3.56 0 008.444 12 3.56 3.56 0 0012 15.555a3.57 3.57 0 003.08-1.778l3.078 1.78A7.135 7.135 0 0112 19.11zm7.11-6.715h-.79v.79h-.79v-.79h-.79v-.79h.79v-.79h.79v.79h.79zm2.962 0h-.79v.79h-.79v-.79h-.79v-.79h.79v-.79h.79v.79h.79z"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#004482"/><stop offset="100%" stop-color="#002547"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="55%" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5EA9E8" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#5EA9E8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <style>
    .halo    { animation: pulse   3.6s ease-in-out 0.7s infinite; }
    .breathe { animation: breathe 3.6s ease-in-out 0.7s infinite; }
    .sheen   { animation: sweep   3.6s ease-in-out 0.7s infinite; }
    .ring    { stroke-dasharray: 210 810; animation: trace 3.6s linear 0.7s infinite; }

    @keyframes breathe { 0%,100% { transform: scale(.95); } 50% { transform: scale(1.05); } }
    @keyframes pulse   { 0%,100% { transform: scale(.85); opacity:.28; } 50% { transform: scale(1.15); opacity:.75; } }
    @keyframes sweep   { 0% { transform: translateX(-190px); } 55%,100% { transform: translateX(190px); } }
    @keyframes trace   { to { stroke-dashoffset: -1020; } }

    @media (prefers-reduced-motion: reduce) {
      .halo,.breathe,.sheen,.ring { animation: none; }
    }
  </style>

  <g clip-path="url(#tile)">
    <rect x="8" y="8" width="240" height="240" rx="62" fill="url(#bg)"/>
    <g transform="translate(128,128)">
      <circle class="halo" cx="0" cy="0" r="78" fill="url(#halo)" filter="url(#soft)"/>
    </g>
  </g>

  <g transform="translate(128,128)">
    <g class="breathe">
      <path transform="translate(-58,-58) scale(4.833)" d="M22.394 6c-.167-.29-.398-.543-.652-.69L12.926.22c-.509-.294-1.34-.294-1.848 0L2.26 5.31c-.508.293-.923 1.013-.923 1.6v10.18c0 .294.104.62.271.91.167.29.398.543.652.69l8.816 5.09c.508.293 1.34.293 1.848 0l8.816-5.09c.254-.147.485-.4.652-.69.167-.29.27-.616.27-.91V6.91c.003-.294-.1-.62-.268-.91zM12 19.11c-3.92 0-7.109-3.19-7.109-7.11 0-3.92 3.19-7.11 7.11-7.11a7.133 7.133 0 016.156 3.553l-3.076 1.78a3.567 3.567 0 00-3.08-1.78A3.56 3.56 0 008.444 12 3.56 3.56 0 0012 15.555a3.57 3.57 0 003.08-1.778l3.078 1.78A7.135 7.135 0 0112 19.11zm7.11-6.715h-.79v.79h-.79v-.79h-.79v-.79h.79v-.79h.79v.79h.79zm2.962 0h-.79v.79h-.79v-.79h-.79v-.79h.79v-.79h.79v.79h.79z" fill="#FFFFFF"/>
      <g clip-path="url(#mark)">
        <rect class="sheen" x="-45" y="-128" width="90" height="256" fill="url(#sheen)"/>
      </g>
    </g>
  </g>

  <rect class="ring" x="8" y="8" width="240" height="240" rx="62"
        fill="none" stroke="#5EA9E8" stroke-width="4" stroke-linecap="round" opacity=".9"/>
</svg>
